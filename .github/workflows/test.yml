name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Full verification on every push/PR. The runner package imports
  # runner/platform/windows, so these jobs must run on Windows.
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      # gui/server.go embeds embed/viiper.exe, which is git-ignored and
      # produced by build.ps1. Build it from the checked-out submodule
      # before compiling the GUI package.
      - name: Build embedded VIIPER binary
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          Push-Location (Join-Path $root 'VIIPER')
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -o (Join-Path $root 'VIIPER\dist\viiper.exe') ./cmd/viiper
          if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }
          Pop-Location
          $dest = Join-Path $root 'app\gui\embed\viiper.exe'
          Copy-Item (Join-Path $root 'VIIPER\dist\viiper.exe') $dest -Force
          if (-not (Test-Path $dest)) { Write-Error "Embedded VIIPER binary missing: $dest"; exit 1 }
      - name: Run vet and tests
        working-directory: app
        run: |
          go vet ./...
          go test ./...
      - name: Run race detector
        working-directory: app
        run: go test -race ./runner/...
      - name: Run dead-methods guard
        working-directory: app
        run: go test ./runner/ -run TestNoDeadMethods -v

  # Build the release package on version tags and attach it to the release.
  release:
    name: Build release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: Package release
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File app/package.ps1
      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BelarusChampTools-Windows-x64
          path: release/BelarusChampTools-Windows-x64.zip
